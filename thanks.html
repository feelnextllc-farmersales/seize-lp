<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お申し込みありがとうございます | Seize</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-900:#0E1630;
    --navy-800:#16234A;
    --paper:#FBFAF7;
    --paper-dim:#F1EFE8;
    --line:#D9D5C9;
    --ink:#181C24;
    --ink-soft:#565D6D;
    --mint:#2FBFA6;
    --mint-deep:#1E8E7A;
    --gold:#E7B84B;
    --radius:2px;
    --serif:'Zen Old Mincho', serif;
    --sans:'Zen Kaku Gothic New', sans-serif;
    --mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html{overflow-x:hidden;}
  body{
    margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
    line-height:1.75; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  a{color:inherit;}
  h1,h2{font-family:var(--serif); font-weight:700; margin:0; color:var(--navy-900);}
  p{margin:0;}
  button{font-family:inherit; cursor:pointer;}

  header{
    padding:18px 24px; border-bottom:1px solid var(--line);
    background:rgba(251,250,247,0.92);
  }
  .logo{font-family:var(--serif); font-size:20px; font-weight:700; letter-spacing:0.06em; color:var(--navy-900); text-decoration:none;}
  .logo span{color:var(--mint-deep);}

  main{
    min-height:calc(100vh - 64px);
    display:flex; align-items:center; justify-content:center;
    padding:56px 20px;
    background:
      linear-gradient(var(--paper), var(--paper)),
      repeating-linear-gradient(0deg, transparent, transparent 39px, var(--line) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, var(--line) 40px);
  }

  .card{
    width:100%; max-width:560px;
    background:var(--paper); border:1px solid var(--line); border-radius:6px;
    box-shadow:0 24px 60px -30px rgba(14,22,48,0.4);
    padding:44px 30px;
    text-align:center;
  }
  @media(max-width:480px){ .card{ padding:36px 22px; } }

  .check{
    width:52px; height:52px; border-radius:50%; background:var(--mint-deep);
    display:flex; align-items:center; justify-content:center; margin:0 auto 26px;
  }
  .check svg{width:24px; height:24px;}

  .eyebrow{
    font-family:var(--mono); font-size:12px; letter-spacing:0.14em; color:var(--mint-deep);
    text-transform:uppercase; margin-bottom:14px;
  }

  h1{
    font-size:clamp(22px,5vw,28px); line-height:1.5;
    word-break:keep-all; overflow-wrap:break-word;
  }

  .sub{
    margin-top:14px; font-size:14.5px; color:var(--ink-soft); line-height:1.9;
  }

  .plan-badge{
    display:inline-block; margin-top:22px; font-family:var(--mono); font-size:12px;
    letter-spacing:0.06em; color:var(--navy-900); background:var(--paper-dim);
    border:1px solid var(--line); border-radius:20px; padding:7px 16px;
    max-width:100%; overflow-wrap:break-word;
  }

  .next-block{
    margin-top:34px; text-align:left; background:var(--paper-dim);
    border:1px solid var(--line); border-radius:var(--radius); padding:22px 22px;
  }
  .next-block h2{
    font-size:14px; font-family:var(--sans); font-weight:700; color:var(--navy-900); margin-bottom:14px;
  }
  .next-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px;}
  .next-list li{display:flex; gap:12px; align-items:flex-start; font-size:13.5px; color:var(--ink-soft);}
  .next-list .num{
    font-family:var(--mono); font-size:11px; color:var(--paper); background:var(--mint-deep);
    width:20px; height:20px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; margin-top:1px;
  }
  .next-list li.is-current{color:var(--navy-900); font-weight:700;}
  .next-list li.is-current .num{background:var(--gold);}

  .cta-wrap{margin-top:32px; display:flex; flex-direction:column; gap:14px; align-items:center;}
  .btn-primary{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    width:100%; max-width:360px;
    background:var(--navy-900); color:var(--paper); text-decoration:none;
    padding:16px 24px; font-size:14.5px; letter-spacing:0.02em; border-radius:var(--radius);
    border:none; transition:background .2s;
    word-break:keep-all; overflow-wrap:break-word; text-align:center;
  }
  .btn-primary:hover{background:var(--mint-deep);}
  .btn-ghost{
    font-size:13px; color:var(--ink-soft); text-decoration:none; border-bottom:1px solid var(--line);
    padding-bottom:2px;
  }
  .btn-ghost:hover{color:var(--navy-900); border-color:var(--navy-900);}

  .notice{
    margin-top:26px; font-size:11.5px; color:var(--ink-soft); line-height:1.8;
    border-top:1px dashed var(--line); padding-top:18px;
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html">SEIZE<span>.</span></a>
</header>

<main>
  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 12.5L9.5 18L20 6" stroke="#FBFAF7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="eyebrow">Thank You</div>
    <h1 id="thanks-title">お申し込みありがとうございます</h1>
    <p class="sub" id="thanks-sub">決済が正常に完了しました。</p>
    <div class="plan-badge" id="plan-badge" hidden></div>

    <div class="next-block">
      <h2>次にやること</h2>
      <ol class="next-list" id="next-list">
        <li><span class="num">1</span><span>決済完了</span></li>
        <li><span class="num">2</span><span>購入したプランを確認</span></li>
        <li><span class="num">3</span><span>プランの開始画面へ進む</span></li>
        <li><span class="num">4</span><span>必要事項を入力してSeizeを開始</span></li>
      </ol>
    </div>

    <div class="cta-wrap" id="cta-wrap"></div>

    <p class="notice">このページはお支払い完了のご案内のみを目的とした静的なページです。プラン開始画面へは、下のボタンからお進みください。</p>
  </div>
</main>

<script>
  // ============================================================
  // プランごとの表示名・遷移先を一元管理
  // (今後プランを追加・変更する場合は、この PLAN_INFO だけを編集してください)
  // ============================================================
  var PLAN_INFO = {
    scout:      { label:'SCOUT',                         cta:'SCOUTを開始する',      formKey:'scout' },
    design:     { label:'DESIGN',                         cta:'DESIGNを開始する',     formKey:'design' },
    growth:     { label:'GROWTH',                         cta:'GROWTHを開始する',     formKey:'growth' },
    foundation: { label:'SCOUT＋DESIGN(FOUNDATION)',       cta:'FOUNDATIONを開始する', formKey:'setScoutDesign' },
    advance:    { label:'DESIGN＋GROWTH(ADVANCE)',         cta:'ADVANCEを開始する',    formKey:'setDesignGrowth' },
    orbit:      { label:'フルセット(ORBIT)',                 cta:'ORBITを開始する',      formKey:'setFull' },
    spark:      { label:'SPARK(5回分)',                    cta:'SPARKを開始する',      formKey:'spark', grant:5 }
  };

  function renderThanks(){
    var params = new URLSearchParams(window.location.search);
    var planKey = params.get('plan');
    var info = planKey ? PLAN_INFO[planKey] : null;

    var ctaWrap = document.getElementById('cta-wrap');

    if(info){
      document.getElementById('thanks-title').textContent = info.label + 'のお申し込みありがとうございます。';
      document.getElementById('thanks-sub').textContent = '決済が正常に完了しました。';

      var badge = document.getElementById('plan-badge');
      badge.textContent = info.label;
      badge.hidden = false;

      var list = document.getElementById('next-list');
      list.innerHTML =
        '<li><span class="num">1</span><span>決済完了</span></li>' +
        '<li><span class="num">2</span><span>購入プラン:' + escapeHTML(info.label) + '</span></li>' +
        '<li class="is-current"><span class="num">3</span><span>下のボタンから開始画面へ進む</span></li>' +
        '<li><span class="num">4</span><span>ヒアリングに回答してSeizeを開始</span></li>';

      var mainBtn = document.createElement('a');
      mainBtn.className = 'btn-primary';
      mainBtn.href = 'index.html?form=' + encodeURIComponent(info.formKey) + (info.grant ? '&grant=' + info.grant : '');
      mainBtn.textContent = info.cta + ' →';
      ctaWrap.appendChild(mainBtn);

      var backLink = document.createElement('a');
      backLink.className = 'btn-ghost';
      backLink.href = 'index.html';
      backLink.textContent = 'Seizeのトップへ戻る';
      ctaWrap.appendChild(backLink);

    } else {
      // plan パラメータがない、または不正な値の場合
      document.getElementById('thanks-title').textContent = 'お申し込みありがとうございます';
      document.getElementById('thanks-sub').textContent = '決済が正常に完了しました。';

      var backBtn = document.createElement('a');
      backBtn.className = 'btn-primary';
      backBtn.href = 'index.html';
      backBtn.textContent = 'Seizeのトップへ戻る →';
      ctaWrap.appendChild(backBtn);
    }
  }

  function escapeHTML(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  renderThanks();
</script>

</body>
</html>
